# Mosquitto broker config
# Due listener: 1883 interno (consumer Django) e 8883 TLS esposto ai gateway.

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# -------------------------------------------------
# Listener interno (solo rete docker, no TLS)
# Il consumer Django gira sulla stessa rete docker e si connette qui.
# -------------------------------------------------
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwd

# -------------------------------------------------
# Listener esterno TLS (gateway in VPN/internet)
# -------------------------------------------------
listener 8883 0.0.0.0
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwd
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
require_certificate false

# -------------------------------------------------
# ACL: ogni gateway può pubblicare solo sul suo sottoramo plants/<gw_id>/#
# e il consumer Django può solo leggere.
# -------------------------------------------------
acl_file /mosquitto/config/acl
